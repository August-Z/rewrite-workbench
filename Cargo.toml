[workspace]
members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
oxc = { version = "=0.149.0", default-features = false, features = ["semantic", "regular_expression"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rewrite-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"
